<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <div class="content-header">
        <h1>Shopping Cart</h1>
      </div>

      <div class="form-section">
        <div class="input-group nameDiv">
          <label for="">Product Name</label>
          <input type="text" name="" id="inputName" />
        </div>

        <div class="input-group priceDiv">
          <label for="">Product Price</label>
          <input type="number" id="inputPrice" />
        </div>

        <div class="button-group"><button>Add Product</button></div>
      </div>

      <div class="cart-section">
        <div class="cart-table"></div>

        <div class="cart-footer-div">
          <p class="total-p">Total<span class="totalSpan">$0.00</span></p>
        </div>
      </div>
    </div>
  </body>
</html>
