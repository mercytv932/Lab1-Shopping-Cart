<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 40px 20px;

        display: flex;
        justify-content: center;
        align-items: center;

        background-color: #eeeeee;
      }
      .container {
        width: 100%;
        max-width: 900px;
        background-color: green;
        display: flex;
        flex-direction: column;
        gap: 30px;
        border: 3px solid black;
        padding: 20px;
      }

      .content-header {
        border: 3px solid red;
        padding: 20px;
      }

      .form-section {
        border: 3px solid blue;
        padding-block-end: 20px;
        display: flex;
        align-items: flex-end;
        gap: 15px;
      }

      .input-group {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
        border: 2px dashed white;
        padding: 10px;
      }

      .button-group {
        border: 2px solid yellow;
        padding: 10px;
      }

      .cart-section {
        border: 3px solid purple;
        padding-block-end: 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .cart-table {
        min-height: 200px;
        border: 3px solid orange;
        padding: 15px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .card-footer-div {
        border: 3px solid cyan;
        padding: 15px;
        display: flex;
        justify-content: center;
      }

      .total-p {
        margin: 0;

        display: flex;
        gap: 15px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="content-header">
        <h1>Shopping Cart</h1>
      </div>

      <div class="form-section">
        <div class="input-group nameDiv">
          <label for="">Product Name</label>
          <input type="text" name="" id="inputName" />
        </div>

        <div class="input-group priceDiv">
          <label for="">Product Price</label>
          <input type="number" id="inputPrice" />
        </div>

        <div class="button-group"><button>Add Product</button></div>
      </div>

      <div class="cart-section">
        <div class="cart-table"></div>

        <div class="cart-footer-div">
          <p class="total-p">Total<span class="totalSpan">$0.00</span></p>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
