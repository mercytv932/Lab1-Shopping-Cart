<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <div class="div-header">
        <h1>Shopping Cart</h1>
        <p class="total">Total<span class="span">$0.00</span></p>
      </div>

      <div class="form-div">
        <div class="input-group name"></div>
        <div class="input-group price"></div>
        <div class="button-group"><button>Add Product</button></div>
      </div>

      <div class="total-div">
        <p class="total">Total<span class="span">$0.00</span></p>
      </div>

      <div class="cart-section">
        <div class="cart-table"></div>

        <div class="cart-section-div">
          <p class="total">Total<span class="span">$0.00</span></p>
        </div>
      </div>
    </div>
  </body>
</html>
