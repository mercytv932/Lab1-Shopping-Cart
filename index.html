<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 40px 20px;

        display: flex;
        justify-content: center;
        align-items: flex-start;

        font-family: Arial, sans-serif;
        background-color: linear-gradient(135deg, #eef2f7, #dfe7f1);
        color: #1f2937;
      }
      .container {
        width: 100%;
        max-width: 900px;
        display: flex;
        flex-direction: column;
        gap: 24px;
        padding: 28px;
        background-color: white;
        border-radius: 18px;
        box-shadow: 0 18px 45px rgba(31, 41, 55, 0.14);
        padding: 28px;
      }

      /* content Header styles */
      .content-header {
        padding-bottom: 18px;
        border-bottom: 1px solid #e5e7eb;
      }

      .content-header h1 {
        margin: 0;
        font-size: 32px;
        letter-spacing: -1px;
      }

      /* Form styles */
      .form-section {
        padding: 22px;
        display: flex;
        align-items: flex-end;
        gap: 16px;
        background-color: #f8fafc;
        border: 1px solid #e2e8fc;
        border-radius: 14px;
      }

      .input-group {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .input-group label {
        font-size: 14px;
        font-weight: 700;
        color: #475569;
      }

      #inputName,
      #inputPrice {
        width: 100%;
        padding: 12px 14px;
        font-size: 15px;
        background-color: white;
        border: 1px solid #cbd5e1;
        border-radius: 9px;
        outline: none;
        transition: 0.2s ease;
      }

      #inputName:focus,
      #inputPrice:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
      }

      .button-group {
        border: 2px solid yellow;
        padding: 4px;
        border-radius: 3px;
        margin-right: 10px;
      }

      .button-group button {
        min-height: 43px;
        padding: 0 20px;
        font-size: 14px;
        font-weight: 700;
        color: white;
        background-color: #2563eb;
        border: none;
        border-radius: 9px;
        cursor: pointer;
        transition:
          transform 0.2s ease,
          background-color 0.2s ease;
      }

      .button-group button:hover {
        background-color: #1d4ed8;
        transform: translateY(-2px);
      }
      /* cart styles */
      .cart-section {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .cart-table {
        min-height: 180px;
        display: flex;
        direction: column;
        gap: 12px;
      }
      /* newProduct/li styles */
      .newProduct {
        padding: 16px 18px;
        display: flex;
        align-items: center;
        gap: 14px;
        background-color: white;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        box-shadow:
          0 5px 16px rgba() 15,
          23,
          42,
          0.07;

        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      .newProduct:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.11);
      }

      .newProduct h3 {
        flex: 1;
        margin: 0;
        font-size: 17px;
        text-transform: capitalize;
      }

      .newProduct p {
        margin: 0;
        min-width: 80px;
        font-weight: 700;
        color: #2563eb;
      }

      .newProduct span {
        min-width: 24px;
        text-align: center;
        font-weight: 700;
      }

      .newProduct button {
        padding: 7px 10px;
        border: none;
        border-radius: 7px;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .newProduct button:hover {
        transform: scale(1.05);
      }

      /* Minus and plus buttons */
      .newProduct button:nth-of-type(1),
      .newProduct button:nth-of-type(2) {
        background-color: #e2e8f0;
        color: #1e293b;
      }

      
      .card-footer-div {
        border: 3px solid cyan;
        padding: 15px;
        display: flex;
        justify-content: center;
      }

      .total-p {
        margin: 5px;

        display: flex;
        gap: 15px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="content-header">
        <h1>Shopping Cart</h1>
      </div>

      <div class="form-section">
        <div class="input-group nameDiv">
          <label for="">Product Name</label>
          <input type="text" name="" id="inputName" placeholder="product..." />
        </div>

        <div class="input-group priceDiv">
          <label for="">Product Price</label>
          <input type="number" id="inputPrice" placeholder="$price..." />
        </div>

        <div class="button-group"><button>Add Product</button></div>
      </div>

      <div class="cart-section">
        <div class="cart-table"></div>

        <div class="cart-footer-div">
          <p class="total-p">Total<span class="totalSpan">$0.00</span></p>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
