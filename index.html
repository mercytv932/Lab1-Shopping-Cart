<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 40px 20px;

        display: flex;
        justify-content: center;
        align-items: flex-start;

        font-family: Arial, sans-serif;
        background-color: linear-gradient(135deg, #eef2f7, #dfe7f1);
        color: #1f2937;
      }
      .container {
        width: 100%;
        max-width: 900px;
        display: flex;
        flex-direction: column;
        gap: 24px;
        padding: 28px;
        background-color: white;
        border-radius: 18px;
        box-shadow: 0 18px 45px rgba(31, 41, 55, 0.14);
        padding: 28px;
      }

      .content-header {
        padding-bottom: 18px;
        border-bottom: 1px solid #e5e7eb;
      }

      .content-header h1 {
        margin: 0;
        font-size: 32px;
        letter-spacing: -1px;
      }

      .form-section {
        padding: 22px;
        display: flex;
        align-items: flex-end;
        gap: 16px;
        background-color: #f8fafc;
        border: 1px solid #e2e8fc;
        border-radius: 14px;
      }

      .input-group {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .input-group label {
        font-size: 14px;
        font-weight: 700;
        color: #475569;
      }

      #inputName,
      #inputPrice {
        border-radius: 10px;
        padding: 12px;
      }

      .button-group {
        border: 2px solid yellow;
        padding: 4px;
        border-radius: 3px;
        margin-right: 10px;
      }

      .button-group button {
        background-color: rgb(0, 151, 0);
        padding: 7px 14px;
        color: white;
        border-radius: 4px;
        cursor: pointer;
        transition: 0.3s ease;
      }

      .button-group button:hover {
        background-color: rgb(1, 125, 1);
        transform: translateY(-1px);
      }

      .cart-section {
        border: 3px solid purple;
        padding-block-end: 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        border-radius: 7px;
      }

      .cart-table {
        min-height: 200px;
        border: 3px solid orange;
        padding: 15px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        border-radius: 7px;
        margin: 5px;
      }

      .newProduct {
        border: 2px solid black;
        /* padding: 7px; */

        display: flex;
        align-items: center;
        gap: 15px;
        background-color: rgb(18, 165, 84);
      }

      .newProduct h3 {
        font-size: 12px;
      }

      .card-footer-div {
        border: 3px solid cyan;
        padding: 15px;
        display: flex;
        justify-content: center;
      }

      .total-p {
        margin: 5px;

        display: flex;
        gap: 15px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="content-header">
        <h1>Shopping Cart</h1>
      </div>

      <div class="form-section">
        <div class="input-group nameDiv">
          <label for="">Product Name</label>
          <input type="text" name="" id="inputName" placeholder="product..." />
        </div>

        <div class="input-group priceDiv">
          <label for="">Product Price</label>
          <input type="number" id="inputPrice" placeholder="$price..." />
        </div>

        <div class="button-group"><button>Add Product</button></div>
      </div>

      <div class="cart-section">
        <div class="cart-table"></div>

        <div class="cart-footer-div">
          <p class="total-p">Total<span class="totalSpan">$0.00</span></p>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
